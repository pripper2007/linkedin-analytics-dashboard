# Auto-deploy to Vercel on every push to main.
#
# We don't use Vercel's native Git integration because the project isn't
# linked to a GitHub identity (the Vercel account has no GH OAuth
# connection, so `vercel git connect` fails). This workflow replaces
# that integration with a plain `vercel deploy --prod` call, authed via
# a token stored in repo secrets.
#
# Secrets required:
#   VERCEL_TOKEN      — from https://vercel.com/account/tokens
#   VERCEL_ORG_ID     — team ID (orgId in .vercel/project.json)
#   VERCEL_PROJECT_ID — project ID (projectId in .vercel/project.json)

name: Deploy to Vercel (Production)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
